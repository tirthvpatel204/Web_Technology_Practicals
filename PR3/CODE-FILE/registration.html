<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration - Event Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1>Event Manager</h1>
    <ul class="nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="registration.html" class="active">Registration</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="feedback.html">Feedback</a></li>
    </ul>
  </header>

  <main class="main">
    <h2 class="page-title">Event Registration</h2>

    <div class="form-box">
      <form>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter phone number">
        </div>

        <div class="form-group">
          <label for="event">Select Event</label>
          <select id="event" name="event" required>
            <option value="">-- Choose Event --</option>
            <option value="workshop">Web Dev Workshop</option>
            <option value="seminar">AI Seminar</option>
            <option value="hackathon">Hackathon 2026</option>
            <option value="fest">Tech Fest</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Comments</label>
          <textarea id="message" name="message" placeholder="Any comments..."></textarea>
        </div>

        <button type="submit" class="btn w-100">Register</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Event Manager</p>
    <p>Practical 3 - Responsive UI Design</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
