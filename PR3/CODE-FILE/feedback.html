<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - Event Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1>Event Manager</h1>
    <ul class="nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="registration.html">Registration</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="feedback.html" class="active">Feedback</a></li>
    </ul>
  </header>

  <main class="main">
    <h2 class="page-title">Feedback</h2>

    <div class="form-box">
      <p class="mb-3">Tell us about your experience with our events.</p>
      <form>
        <div class="form-group">
          <label for="fb-name">Your Name</label>
          <input type="text" id="fb-name" placeholder="Enter name">
        </div>

        <div class="form-group">
          <label for="fb-event">Event Attended</label>
          <select id="fb-event">
            <option value="">-- Select Event --</option>
            <option value="workshop">Web Dev Workshop</option>
            <option value="seminar">AI Seminar</option>
            <option value="hackathon">Hackathon 2026</option>
            <option value="fest">Tech Fest</option>
          </select>
        </div>

        <div class="form-group">
          <label>Rating</label>
          <div class="d-flex gap-3 flex-wrap">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="rating" id="r1" value="1">
              <label class="form-check-label" for="r1">1 - Poor</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="rating" id="r2" value="2">
              <label class="form-check-label" for="r2">2 - Fair</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="rating" id="r3" value="3" checked>
              <label class="form-check-label" for="r3">3 - Good</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="rating" id="r4" value="4">
              <label class="form-check-label" for="r4">4 - Very Good</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="rating" id="r5" value="5">
              <label class="form-check-label" for="r5">5 - Excellent</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="fb-comments">Comments</label>
          <textarea id="fb-comments" placeholder="Share your feedback..."></textarea>
        </div>

        <button type="submit" class="btn w-100">Submit Feedback</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Event Manager</p>
    <p>Practical 3 - Responsive UI Design</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
