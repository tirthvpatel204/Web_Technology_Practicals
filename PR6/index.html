<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical 6 - JSON Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">J6</span>
    <div><h1>JSON Explorer</h1><p>Fetch API • Search • Filter • Sort • Pagination</p></div>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <span class="badge">PRACTICAL 6</span>
      <h2>Dynamic Data Dashboard</h2>
      <p>Explore external JSON data with reusable JavaScript modules.</p>
    </div>
    <div class="stats"><strong id="recordCount">0</strong><span>Records</span></div>
  </section>

  <nav class="tabs">
    <button class="tab active" data-type="events">Events</button>
    <button class="tab" data-type="students">Students</button>
    <button class="tab" data-type="faqs">FAQs</button>
  </nav>

  <section class="controls">
    <input id="searchInput" type="search" placeholder="Search records..." autocomplete="off">
    <select id="filterSelect"><option value="all">All Categories</option></select>
    <select id="sortSelect">
      <option value="default">Sort: Default</option>
      <option value="az">Name / Title A-Z</option>
      <option value="za">Name / Title Z-A</option>
    </select>
    <select id="pageSize">
      <option value="6">6 / page</option>
      <option value="9">9 / page</option>
      <option value="12">12 / page</option>
    </select>
  </section>

  <div id="status" class="status">Loading...</div>
  <section id="dataContainer" class="grid"></section>
  <div id="pagination" class="pagination"></div>
</main>

<footer>Practical 6 • External JSON Data using Fetch API • ES6+</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
